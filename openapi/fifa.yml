  /fifa/worldcup/v1/odds/opening:
    get:
      summary: Get FIFA opening betting odds
      description: Retrieve historical opening betting odds. Coverage is limited to the most recently completed season and ongoing seasons where available. Requires GOAT tier.
      tags:
