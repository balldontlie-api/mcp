  /fifa/worldcup/v1/odds/futures:
    get:
      summary: Get FIFA World Cup futures odds
      description: Retrieve futures betting odds for the FIFA World Cup. Defaults to 2026 when seasons[] is omitted. Requires GOAT tier.
      tags:
        - FIFA
      parameters:
        - $ref: "#/components/parameters/SeasonsParam"
