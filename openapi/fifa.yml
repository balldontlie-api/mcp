        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /fifa/worldcup/v1/odds/player_props:
    get:
      summary: Get FIFA World Cup player prop betting odds
      description: |
        Retrieve live player prop betting data for FIFA World Cup matches. Player prop data is live and updated in real time.

        This endpoint returns all player props for the specified match in a single response. Cursor pagination is not supported.

        The API supports two market types:
        - **over_under**: Traditional over/under markets where users can bet on whether a player will go over or under a specific line value
        - **milestone**: Milestone markets where users bet on whether a player will reach a specific achievement

        Available vendors: betmgm, betrivers, caesars, draftkings, fanatics, fanduel
      tags:
        - FIFA
      parameters:
        - name: match_id
          in: query
          required: true
          schema:
            type: integer
          description: The match ID to retrieve player props for.
        - name: player_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter props for a specific player.
        - name: prop_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - anytime_goal
              - assists
              - card
              - first_goal
              - goal_or_assist
              - last_goal
              - red_card
              - saves
              - shot_each_half
              - shot_on_target_each_half
              - shots
              - shots_on_target
              - tackles
          description: Filter by prop type.
        - name: vendors[]
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - betmgm
                - betrivers
                - caesars
                - draftkings
                - fanatics
                - fanduel
          style: form
          explode: true
          description: Filter by specific sportsbook vendors. Use bracket notation, for example `?vendors[]=draftkings&vendors[]=fanduel`.
      responses:
        "200":
          description: FIFA World Cup player prop betting odds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FIFAPlayerProp"
                  meta:
                    $ref: "#/components/schemas/PlayerPropMeta"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /fifa/worldcup/v1/odds/player_props/opening:
    get:
      summary: Get FIFA opening player prop odds
      description: Retrieve historical opening player prop betting odds. Coverage is limited to the most recently completed season and ongoing seasons where available. Requires GOAT tier.
      tags:
        - FIFA
      parameters:
        - name: match_id
          in: query
          required: true
          schema:
            type: integer
          description: The match ID to retrieve opening player props for
        - name: player_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter props for a specific player
        - name: prop_type
          in: query
          required: false
          schema:
            type: string
          description: Filter by prop type
        - name: vendors
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Filter by sportsbook vendors
      responses:
        "200":
          description: Opening odds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FIFAOpeningPlayerProp"
