openapi: 3.1.0
info:
  title: BALLDONTLIE - FIFA World Cup API
  version: 1.0.0
  description: FIFA World Cup endpoints for the BallDontLie API. Covers the 2018, 2022, and 2026 tournaments. Endpoints that filter by season accept a `seasons[]` query parameter; when omitted they default to the current edition (2026).
servers:
  - url: https://api.balldontlie.io
    description: Production server
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  parameters:
    SeasonsParam:
      name: seasons[]
      in: query
      required: false
      description: "Filter to specific World Cup edition years. Allowed values: 2018, 2022, 2026. Default is the current edition (2026)."
      schema:
        type: array
        items:
          type: integer
          enum: [2018, 2022, 2026]
    MatchIdsParam:
      name: match_ids[]
      in: query
      required: false
      description: Filter to specific match IDs.
      schema:
        type: array
        items:
          type: integer
    TeamIdsParam:
      name: team_ids[]
      in: query
      required: false
      description: Filter to specific team IDs.
      schema:
        type: array
        items:
          type: integer
    PlayerIdsParam:
      name: player_ids[]
      in: query
      required: false
      description: Filter to specific player IDs.
      schema:
        type: array
        items:
          type: integer
    InjuryStatusesParam:
      name: statuses[]
      in: query
      required: false
      description: Filter to specific injury statuses, such as OUT or GTD.
      schema:
        type: array
        items:
          type: string
    SearchParam:
      name: search
      in: query
      required: false
      description: Case-insensitive substring match on player name.
      schema:
        type: string
    PerPageParam:
      name: per_page
      in: query
      required: false
      description: Page size, max 100.
      schema:
        type: integer
        default: 25
        maximum: 100
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Cursor for the next page.
      schema:
        type: integer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
    FIFASeason:
      type: object
      properties:
        id:
          type: integer
        year:
          type: integer
          enum: [2018, 2022, 2026]
    FIFABettingOdd:
      type: object
      properties:
        id:
          type: integer
        match_id:
          type: integer
        vendor:
          type: string
        moneyline_home_odds:
          type: integer
          nullable: true
        moneyline_away_odds:
          type: integer
          nullable: true
        moneyline_draw_odds:
          type: integer
          nullable: true
        spread_home_value:
          type: string
          nullable: true
          description: Home spread line value.
        spread_home_odds:
          type: integer
          nullable: true
        spread_away_value:
          type: string
          nullable: true
          description: Away spread line value.
        spread_away_odds:
          type: integer
          nullable: true
        total_value:
          type: string
          nullable: true
          description: Total goals line value.
        total_over_odds:
          type: integer
          nullable: true
        total_under_odds:
          type: integer
          nullable: true
        markets:
          type: array
          description: Additional match markets for this vendor and match. Top-level moneyline, spread, and total fields remain the canonical summary line; expanded markets such as correct score, team totals, double chance, alternate spreads, and period markets are returned here.
          items:
            $ref: "#/components/schemas/FIFABettingMarket"
        updated_at:
          type: string
          format: date-time
    FIFAOpeningPlayerProp:
      type: object
      properties:
        id:
          type: integer
          format: int64
        match_id:
          type: integer
        player_id:
          type: integer
        vendor:
          type: string
          enum:
            - betmgm
            - betrivers
            - caesars
            - draftkings
            - fanatics
            - fanduel
        prop_type:
          type: string
          description: Type of FIFA World Cup player prop
          enum:
            - anytime_goal
            - assists
            - card
            - first_goal
            - goal_or_assist
            - last_goal
            - red_card
            - saves
            - shot_each_half
            - shot_on_target_each_half
            - shots
            - shots_on_target
            - tackles
        line_value:
          type: string
          description: The line value for the prop.
        market:
          oneOf:
            - $ref: "#/components/schemas/FIFAPlayerPropMarketMilestone"
            - $ref: "#/components/schemas/FIFAPlayerPropMarketOverUnder"
        opened_at:
          type: string
          format: date-time
    FIFAOpeningBettingOdd:
      type: object
      properties:
        id:
          type: integer
        match_id:
          type: integer
        vendor:
          type: string
        moneyline_home_odds:
          type: integer
          nullable: true
        moneyline_away_odds:
          type: integer
          nullable: true
        moneyline_draw_odds:
          type: integer
          nullable: true
        spread_home_value:
          type: string
          nullable: true
          description: Home spread line value.
        spread_home_odds:
          type: integer
          nullable: true
        spread_away_value:
          type: string
          nullable: true
          description: Away spread line value.
        spread_away_odds:
          type: integer
          nullable: true
        total_value:
          type: string
          nullable: true
          description: Total goals line value.
        total_over_odds:
          type: integer
          nullable: true
        total_under_odds:
          type: integer
          nullable: true
        opened_at:
          type: string
          format: date-time
    FIFABettingMarket:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
          description: Stable normalized market key for this vendor, match, and market. Useful for grouping the same market across refreshes; use `name` for display.
        name:
          type: string
          description: Sportsbook market display name, such as `Correct Score`, `Mexico Team Total Goals`, `Double Chance`, or `2 Way Spread Away Team -1.5 Goals`. Names can vary by vendor.
        type:
          type: string
          description: Normalized market category.
          enum:
            - moneyline
            - spread
            - total
            - team_total
            - correct_score
            - double_chance
            - draw_no_bet
            - both_teams_to_score
            - result_combo
            - margin
            - timing
            - other
        period:
          type: string
          description: Match period the market applies to.
          enum:
            - match
            - first_half
            - second_half
            - other
        scope:
          type: string
          description: Entity scope for the market.
          enum:
            - match
            - home_team
            - away_team
            - both_teams
            - other
        team_side:
          type: string
          nullable: true
          description: Team side when the market is scoped to one team.
          enum:
            - home
            - away
        line_value:
          type: string
          nullable: true
          description: Market-level line value when a single line applies to the market. Some markets carry line values on each outcome instead.
        updated_at:
          type: string
          format: date-time
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/FIFABettingMarketOutcome"
    FIFABettingMarketOutcome:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
          description: Stable normalized outcome key for this market outcome. Useful for grouping the same outcome across refreshes; use `name` for display.
        name:
          type: string
          description: Sportsbook outcome display name, such as `Over`, `Under`, `Mexico +1.5 Goals`, `1-0`, `Yes`, or `Mexico or Tie`.
        type:
          type: string
          description: Normalized outcome category.
          enum:
            - home
            - away
            - draw
            - over
            - under
            - yes
            - no
            - score
            - margin
            - double_chance
            - other
        side:
          type: string
          nullable: true
          description: Home or away side when the outcome maps directly to a team.
          enum:
            - home
            - away
        line_value:
          type: string
          nullable: true
          description: Outcome-level line value when applicable.
        handicap:
          type: string
          nullable: true
          description: Handicap value for spread-style outcomes when applicable.
        american_odds:
          type: integer
          nullable: true
        decimal_odds:
          type: number
          nullable: true
        updated_at:
          type: string
          format: date-time
    FIFAFuturesOdd:
      type: object
      properties:
        id:
          type: integer
        market_type:
          type: string
          description: Type of futures market
        market_name:
          type: string
          description: Name of the futures market
        subject:
          $ref: "#/components/schemas/FIFATeam"
          description: Team the odds are for
        vendor:
          type: string
        american_odds:
          type: integer
          nullable: true
        decimal_odds:
          type: number
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    FIFAPlayerProp:
      type: object
      properties:
        id:
          type: integer
        match_id:
          type: integer
        player_id:
          type: integer
        vendor:
          type: string
          enum:
            - betmgm
            - betrivers
            - caesars
            - draftkings
            - fanatics
            - fanduel
        prop_type:
          type: string
          description: Type of FIFA World Cup player prop
          enum:
            - anytime_goal
            - assists
            - card
            - first_goal
            - goal_or_assist
            - last_goal
            - red_card
            - saves
            - shot_each_half
            - shot_on_target_each_half
            - shots
            - shots_on_target
            - tackles
        line_value:
          type: string
          description: The line value for the prop.
        market:
          oneOf:
            - $ref: "#/components/schemas/FIFAPlayerPropMarketMilestone"
            - $ref: "#/components/schemas/FIFAPlayerPropMarketOverUnder"
        updated_at:
          type: string
          format: date-time
    FIFAPlayerPropMarketMilestone:
      type: object
      required:
        - type
        - odds
      properties:
        type:
          type: string
          enum:
            - milestone
        odds:
          type: integer
          description: American odds for milestone bet.
    FIFAPlayerPropMarketOverUnder:
      type: object
      required:
        - type
        - over_odds
        - under_odds
      properties:
        type:
          type: string
          enum:
            - over_under
        over_odds:
          type: integer
          description: American odds for over bet.
        under_odds:
          type: integer
          description: American odds for under bet.
    FIFAGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Group name (e.g., "A", "B")
    FIFAReferee:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country_code:
          type: string
          nullable: true
        country_name:
          type: string
          nullable: true
    FIFAManager:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        short_name:
          type: string
          nullable: true
    FIFAPlayer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        short_name:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date-time
          nullable: true
        country_code:
          type: string
          nullable: true
        country_name:
          type: string
          nullable: true
        height_cm:
          type: integer
          nullable: true
        jersey_number:
          type: string
          nullable: true
    FIFAPlayerInjury:
      type: object
      description: Current FIFA World Cup player injury report
      properties:
        id:
          type: integer
          description: Injury report ID
        season:
          $ref: "#/components/schemas/FIFASeason"
        player:
          $ref: "#/components/schemas/FIFAPlayer"
        team:
          $ref: "#/components/schemas/FIFATeam"
        position:
          type: string
          nullable: true
          description: Player position
        injury_type:
          type: string
          nullable: true
          description: Injury or absence type
        status:
          type: string
          description: Injury status, such as OUT or GTD
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the current injury snapshot was refreshed
    FIFAMatch:
      type: object
      properties:
        id:
          type: integer
        match_number:
          type: integer
          nullable: true
        datetime:
          type: string
          format: date-time
          description: Match date and time in UTC
        status:
          type: string
          description: Match status (scheduled, in_progress, completed, postponed, cancelled)
        clock_display:
          type: string
          nullable: true
          description: Current live match clock for display with seconds granularity, such as 47:15 or 90+02:30 (null outside live matches)
        clock_seconds:
          type: integer
          nullable: true
          description: Raw elapsed match seconds for the live clock (null outside live matches)
        season:
          $ref: "#/components/schemas/FIFASeason"
        stage:
          $ref: "#/components/schemas/FIFAStage"
        group:
          $ref: "#/components/schemas/FIFAGroup"
          nullable: true
        stadium:
          $ref: "#/components/schemas/FIFAStadium"
          nullable: true
        home_team:
          $ref: "#/components/schemas/FIFATeam"
          nullable: true
          description: Home team (null if TBD in knockout stage)
        away_team:
          $ref: "#/components/schemas/FIFATeam"
          nullable: true
          description: Away team (null if TBD in knockout stage)
        home_team_source:
          $ref: "#/components/schemas/FIFAMatchTeamSource"
          nullable: true
          description: Source info when home team is TBD
        away_team_source:
          $ref: "#/components/schemas/FIFAMatchTeamSource"
          nullable: true
          description: Source info when away team is TBD
        home_score:
          type: integer
          nullable: true
        away_score:
          type: integer
          nullable: true
        home_score_penalties:
          type: integer
          nullable: true
        away_score_penalties:
          type: integer
          nullable: true
        first_half_home_score:
          type: integer
          nullable: true
        first_half_away_score:
          type: integer
          nullable: true
        second_half_home_score:
          type: integer
          nullable: true
        second_half_away_score:
          type: integer
          nullable: true
        extra_time_home_score:
          type: integer
          nullable: true
        extra_time_away_score:
          type: integer
          nullable: true
        has_extra_time:
          type: boolean
          nullable: true
        has_penalty_shootout:
          type: boolean
          nullable: true
        round_number:
          type: integer
          nullable: true
        round_name:
          type: string
          nullable: true
        home_formation:
          type: string
          nullable: true
        away_formation:
          type: string
          nullable: true
        referee:
          $ref: "#/components/schemas/FIFAReferee"
          nullable: true
        home_manager:
          $ref: "#/components/schemas/FIFAManager"
          nullable: true
        away_manager:
          $ref: "#/components/schemas/FIFAManager"
          nullable: true
    FIFAMatchTeamSource:
      type: object
      description: Source information for TBD teams in knockout matches
      properties:
        type:
          type: string
          description: Source type (group_1st, group_2nd, winner, loser, etc.)
        source_match_id:
          type: integer
          nullable: true
        source_match_number:
          type: integer
          nullable: true
        source_group_id:
          type: integer
          nullable: true
        source_group_name:
          type: string
          nullable: true
        placeholder:
          type: string
          nullable: true
        description:
          type: string
          description: Human-readable description (e.g., "Winner of Match 49")
    FIFAStadium:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Stadium name
        city:
          type: string
          nullable: true
          description: Host city
        country:
          type: string
          nullable: true
          description: Country code
        capacity:
          type: integer
          nullable: true
          description: Seating capacity
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
    FIFAStage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Stage name (e.g., "Group Stage", "Round of 16")
        order:
          type: integer
          description: Stage sequence order
    FIFAStanding:
      type: object
      properties:
        season:
          $ref: "#/components/schemas/FIFASeason"
        team:
          $ref: "#/components/schemas/FIFATeam"
        group:
          $ref: "#/components/schemas/FIFAGroup"
        position:
          type: integer
          description: Position within the group
        played:
          type: integer
        won:
          type: integer
        drawn:
          type: integer
        lost:
          type: integer
        goals_for:
          type: integer
        goals_against:
          type: integer
        goal_difference:
          type: integer
        points:
          type: integer
    FIFATeam:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Full country name
        abbreviation:
          type: string
          nullable: true
          description: Three-letter country code (e.g., USA, BRA, GER)
        country_code:
          type: string
          nullable: true
          description: ISO country code
        confederation:
          type: string
          nullable: true
          description: FIFA confederation (UEFA, CONMEBOL, CONCACAF, CAF, AFC, OFC)
    FIFARoster:
      type: object
      description: Per-tournament squad entry (one row per player per team per edition)
      properties:
        season:
          $ref: "#/components/schemas/FIFASeason"
        team_id:
          type: integer
        player:
          $ref: "#/components/schemas/FIFAPlayer"
        position:
          type: string
          nullable: true
        appearances:
          type: integer
        starts:
          type: integer
        minutes_played:
          type: integer
        goals:
          type: integer
        assists:
          type: integer
        yellow_cards:
          type: integer
        red_cards:
          type: integer
        avg_rating:
          type: number
          nullable: true
    FIFAMatchLineup:
      type: object
      description: Registered match-day squad entry (starter or substitute)
      properties:
        match_id:
          type: integer
        team_id:
          type: integer
        player:
          $ref: "#/components/schemas/FIFAPlayer"
        is_starter:
          type: boolean
        is_substitute:
          type: boolean
        shirt_number:
          type: integer
          nullable: true
        position:
          type: string
          nullable: true
        formation:
          type: string
          nullable: true
    FIFAMatchEvent:
      type: object
      description: Time-ordered match incident (goal, card, substitution, period marker, shootout kick)
      properties:
        id:
          type: integer
        match_id:
          type: integer
        incident_type:
          type: string
          description: One of goal, card, substitution, period, injuryTime, penaltyShootout
        incident_class:
          type: string
          nullable: true
        time_minute:
          type: integer
          nullable: true
        added_time:
          type: integer
          nullable: true
        period:
          type: string
          nullable: true
        is_home:
          type: boolean
          nullable: true
        player:
          $ref: "#/components/schemas/FIFAPlayer"
          nullable: true
        assist_player:
          $ref: "#/components/schemas/FIFAPlayer"
          nullable: true
        player_in:
          $ref: "#/components/schemas/FIFAPlayer"
          nullable: true
        player_out:
          $ref: "#/components/schemas/FIFAPlayer"
          nullable: true
        home_score:
          type: integer
          nullable: true
        away_score:
          type: integer
          nullable: true
        shootout_sequence:
          type: integer
          nullable: true
        shootout_description:
          type: string
          nullable: true
        rescinded:
          type: boolean
          nullable: true
        reason:
          type: string
          nullable: true
    FIFAPlayerMatchStats:
      type: object
      properties:
        match_id:
          type: integer
        player_id:
          type: integer
        team_id:
          type: integer
        is_home:
          type: boolean
        rating:
          type: number
          nullable: true
        minutes_played:
          type: integer
          nullable: true
        expected_goals:
          type: number
          nullable: true
        expected_assists:
          type: number
          nullable: true
        goals:
          type: integer
          nullable: true
        assists:
          type: integer
          nullable: true
        shots_on_target:
          type: integer
          nullable: true
        passes_total:
          type: integer
          nullable: true
        passes_accurate:
          type: integer
          nullable: true
        key_passes:
          type: integer
          nullable: true
        long_balls_total:
          type: integer
          nullable: true
        long_balls_accurate:
          type: integer
          nullable: true
        crosses_total:
          type: integer
          nullable: true
        crosses_accurate:
          type: integer
          nullable: true
        dribbles_attempted:
          type: integer
          nullable: true
        dribbles_completed:
          type: integer
          nullable: true
        tackles:
          type: integer
          nullable: true
        tackles_won:
          type: integer
          nullable: true
        interceptions:
          type: integer
          nullable: true
        clearances:
          type: integer
          nullable: true
        blocked_shots:
          type: integer
          nullable: true
        duels_won:
          type: integer
          nullable: true
        duels_lost:
          type: integer
          nullable: true
        aerial_duels_won:
          type: integer
          nullable: true
        aerial_duels_lost:
          type: integer
          nullable: true
        fouls_committed:
          type: integer
          nullable: true
        was_fouled:
          type: integer
          nullable: true
        touches:
          type: integer
          nullable: true
        possession_lost:
          type: integer
          nullable: true
        ball_recoveries:
          type: integer
          nullable: true
        big_chances_created:
          type: integer
          nullable: true
        big_chances_missed:
          type: integer
          nullable: true
        saves:
          type: integer
          nullable: true
        saves_inside_box:
          type: integer
          nullable: true
        punches:
          type: integer
          nullable: true
        high_claims:
          type: integer
          nullable: true
    FIFATeamMatchStats:
      type: object
      properties:
        match_id:
          type: integer
        team_id:
          type: integer
        is_home:
          type: boolean
        possession_pct:
          type: integer
          nullable: true
          description: Possession percentage (0-100)
        expected_goals:
          type: number
          nullable: true
        big_chances:
          type: integer
          nullable: true
        big_chances_missed:
          type: integer
          nullable: true
        shots_total:
          type: integer
          nullable: true
        shots_on_target:
          type: integer
          nullable: true
        shots_off_target:
          type: integer
          nullable: true
        shots_blocked:
          type: integer
          nullable: true
        shots_inside_box:
          type: integer
          nullable: true
        shots_outside_box:
          type: integer
          nullable: true
        hit_woodwork:
          type: integer
          nullable: true
        corners:
          type: integer
          nullable: true
        offsides:
          type: integer
          nullable: true
        fouls:
          type: integer
          nullable: true
        yellow_cards:
          type: integer
          nullable: true
        passes_total:
          type: integer
          nullable: true
        passes_accurate:
          type: integer
          nullable: true
        passes_final_third:
          type: integer
          nullable: true
        long_balls_total:
          type: integer
          nullable: true
        long_balls_accurate:
          type: integer
          nullable: true
        crosses_total:
          type: integer
          nullable: true
        crosses_accurate:
          type: integer
          nullable: true
        tackles:
          type: integer
          nullable: true
        interceptions:
          type: integer
          nullable: true
        clearances:
          type: integer
          nullable: true
        saves:
          type: integer
          nullable: true
        ground_duels_won:
          type: integer
          nullable: true
