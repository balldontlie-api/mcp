  /mlb/v1/odds/markets:
    get:
      summary: Get all current MLB betting markets
      description: |
        Retrieve the current market catalog for one MLB game. This open-ended endpoint includes game, team, inning, player, comparison, milestone, and other market structures without requiring market names or keys to come from a fixed list.

        Complete current catalogs are available for DraftKings and FanDuel. Sportsbooks supported by the simplified odds or player-props endpoints may not appear here until complete market catalogs are available.

        Markets are paginated as complete units. Outcomes may have null prices while their status is `locked` or `suspended`. Use `/mlb/v1/odds/player_props` when you only need the simplified single-player over/under and milestone projection.
      tags:
        - MLB
      parameters:
        - name: game_id
          in: query
          required: true
          schema:
            type: integer
          description: Game ID to retrieve markets for
        - name: vendors
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Filter by sportsbook vendors. Complete current catalogs are available for `draftkings` and `fanduel`.
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Current MLB betting markets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MLBBettingMarket"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
