openapi: 3.1.0
info:
  title: BALLDONTLIE - MLB API
  version: 1.0.0
  description: MLB endpoints for the BallDontLie API.
servers:
  - url: https://api.balldontlie.io
    description: Production server
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
    MLBBettingOdd:
      type: object
      properties:
        id:
          type: integer
        game_id:
          type: integer
        vendor:
          type: string
          description: Sportsbook vendor name
        spread_home_value:
          type: string
          nullable: true
        spread_home_odds:
          type: integer
          nullable: true
        spread_away_value:
          type: string
          nullable: true
        spread_away_odds:
          type: integer
          nullable: true
        moneyline_home_odds:
          type: integer
          nullable: true
        moneyline_away_odds:
          type: integer
          nullable: true
        total_value:
          type: string
          nullable: true
        total_over_odds:
          type: integer
          nullable: true
        total_under_odds:
          type: integer
          nullable: true
        updated_at:
          type: string
          format: date-time
    MLBMarketStatus:
      type: string
      enum:
        - open
        - locked
        - suspended
        - closed
        - unknown
    MLBMarketParticipant:
      type: object
      required:
        - type
        - id
        - name
      properties:
        type:
          type: string
          enum:
            - player
            - team
            - other
        id:
          type: integer
          nullable: true
          description: BALLDONTLIE entity ID when a participant is matched
        name:
          type: string
    MLBBettingMarketOutcome:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        name:
          type: string
        type:
          type: string
        side:
          type: string
          nullable: true
        line_value:
          type: string
          nullable: true
        handicap:
          type: string
          nullable: true
        american_odds:
          type: integer
          nullable: true
        decimal_odds:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/MLBMarketStatus"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/MLBMarketParticipant"
        updated_at:
          type: string
          format: date-time
    MLBBettingMarket:
      type: object
      properties:
        id:
          type: integer
        game_id:
          type: integer
        vendor:
          type: string
        key:
          type: string
          description: Open-ended normalized market key
        name:
          type: string
          description: Sportsbook market display name
        type:
          type: string
        period:
          type: string
        scope:
          type: string
        team_side:
          type: string
          nullable: true
        line_value:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/MLBMarketStatus"
        is_live:
          type: boolean
        updated_at:
          type: string
          format: date-time
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/MLBBettingMarketOutcome"
    MLBOpeningPlayerProp:
      type: object
      properties:
        id:
          type: integer
          format: int64
        game_id:
          type: integer
        player_id:
          type: integer
        vendor:
          type: string
          enum:
            - betmgm
            - betrivers
            - caesars
            - draftkings
            - fanatics
            - fanduel
        prop_type:
          type: string
          description: Open-ended MLB player prop type. Common examples include hits, home_runs, total_bases, runs_scored, hits_runs_rbis, and pitcher_strikeouts.
        line_value:
          type: string
        market:
          type: object
          properties:
            type:
              type: string
              enum:
                - over_under
                - milestone
            over_odds:
              type: integer
              nullable: true
            under_odds:
              type: integer
              nullable: true
            odds:
              type: integer
              nullable: true
              description: Used for milestone market type
        opened_at:
          type: string
          format: date-time
    MLBOpeningBettingOdd:
      type: object
      properties:
        id:
          type: integer
        game_id:
          type: integer
        vendor:
          type: string
          description: Sportsbook vendor name
        spread_home_value:
          type: string
          nullable: true
        spread_home_odds:
          type: integer
          nullable: true
        spread_away_value:
          type: string
          nullable: true
        spread_away_odds:
          type: integer
          nullable: true
        moneyline_home_odds:
          type: integer
          nullable: true
        moneyline_away_odds:
          type: integer
          nullable: true
        total_value:
          type: string
          nullable: true
        total_over_odds:
          type: integer
          nullable: true
        total_under_odds:
          type: integer
          nullable: true
        opened_at:
          type: string
          format: date-time
    MLBGame:
      type: object
      properties:
        id:
          type: integer
        home_team_name:
          type: string
        away_team_name:
          type: string
        home_team:
          $ref: "#/components/schemas/MLBTeam"
        away_team:
          $ref: "#/components/schemas/MLBTeam"
        season:
          type: integer
        postseason:
          type: boolean
        season_type:
          type: string
          enum:
            - spring_training
            - regular
            - postseason
          description: The type of season (spring_training, regular, or postseason)
        date:
          type: string
          format: date-time
        home_team_data:
          type: object
          properties:
            hits:
              type: integer
            runs:
              type: integer
            errors:
              type: integer
            inning_scores:
              type: array
              items:
                type: integer
        away_team_data:
          type: object
          properties:
            hits:
              type: integer
            runs:
              type: integer
            errors:
              type: integer
            inning_scores:
              type: array
              items:
                type: integer
        venue:
          type: string
        attendance:
          type: integer
        conference_play:
          type: boolean
        period:
          type: integer
          nullable: true
        clock:
          type: integer
          nullable: true
        display_clock:
          type: string
          nullable: true
        scoring_summary:
          type: array
          items:
            type: object
            properties:
              play:
                type: string
              inning:
                type: string
              period:
                type: string
              away_score:
                type: integer
              home_score:
                type: integer
        status:
          type: string
    MLBPitchDetail:
      type: object
      properties:
        pitch_number:
          type: integer
          description: Pitch number within the plate appearance
        balls:
          type: integer
          nullable: true
          description: Ball count before this pitch
        strikes:
          type: integer
          nullable: true
          description: Strike count before this pitch
        pitch_call:
          type: string
          nullable: true
          description: Umpire call (B=ball, S=strike, X=in play)
        description:
          type: string
          nullable: true
          description: Detailed pitch outcome label
        pitch_call_code:
          type: string
          nullable: true
          description: Raw pitch call code from the data source
        call_name:
          type: string
          nullable: true
          description: Human-readable pitch call name
        pitch_type_code:
          type: string
          nullable: true
          description: Short pitch type code (FF, SL, CU, CH, etc.)
        pitch_type:
          type: string
          nullable: true
          description: Full pitch type name (e.g., "4-Seam Fastball")
        release_speed:
          type: number
          nullable: true
          description: Pitch velocity at release (mph)
        plate_speed:
          type: number
          nullable: true
          description: Pitch velocity at plate (mph)
        spin_rate:
          type: number
          nullable: true
          description: Spin rate (RPM)
        release_extension:
          type: number
          nullable: true
          description: Pitcher extension (feet)
        plate_time:
          type: number
          nullable: true
          description: Time to reach plate (seconds)
        plate_x:
          type: number
          nullable: true
          description: Horizontal plate location (feet from center)
        plate_z:
          type: number
          nullable: true
          description: Vertical plate location (feet above ground)
        strike_zone:
          type: integer
          nullable: true
          description: Strike zone region (1-14)
        strike_zone_top:
          type: number
          nullable: true
        strike_zone_bottom:
          type: number
          nullable: true
        horizontal_movement:
          type: number
          nullable: true
          description: Horizontal pitch movement (inches)
        vertical_movement:
          type: number
          nullable: true
          description: Vertical pitch movement (inches)
        horizontal_break:
          type: number
          nullable: true
        vertical_break:
          type: number
          nullable: true
        induced_vertical_break:
          type: number
          nullable: true
          description: Gravity-corrected vertical break (inches)
        release_pos_x:
          type: number
          nullable: true
        release_pos_y:
          type: number
          nullable: true
        release_pos_z:
          type: number
          nullable: true
        velocity_x:
          type: number
          nullable: true
        velocity_y:
          type: number
          nullable: true
        velocity_z:
          type: number
          nullable: true
        acceleration_x:
          type: number
          nullable: true
        acceleration_y:
          type: number
          nullable: true
        acceleration_z:
          type: number
          nullable: true
        bat_speed:
          type: number
          nullable: true
          description: Bat speed on contact (mph)
        exit_velocity:
          type: number
          nullable: true
          description: Exit velocity off the bat (mph). Only populated for balls in play.
        launch_angle:
          type: number
          nullable: true
          description: Launch angle off the bat (degrees). Only populated for balls in play.
        hit_distance:
          type: integer
          nullable: true
          description: Projected hit distance (feet). Only populated for balls in play.
        expected_batting_average:
          type: number
          nullable: true
          description: Expected batting average based on exit velocity and launch angle. Only populated for balls in play.
        is_barrel:
          type: boolean
          nullable: true
          description: Whether the batted ball qualifies as a barrel. Only populated for balls in play.
        hit_coordinate_x:
          type: number
          nullable: true
          description: Horizontal hit coordinate on the field spray chart. Only populated for balls in play.
        hit_coordinate_y:
          type: number
          nullable: true
          description: Vertical hit coordinate on the field spray chart. Only populated for balls in play.
        is_in_zone:
          type: boolean
          nullable: true
          description: Whether the pitch crossed the strike zone
        is_swing:
          type: boolean
          nullable: true
          description: Whether the batter swung at the pitch
        is_whiff:
          type: boolean
          nullable: true
          description: Whether the swing missed the pitch
        is_contact:
          type: boolean
          nullable: true
          description: Whether the swing made contact
        is_chase:
          type: boolean
          nullable: true
          description: Whether the batter chased a pitch outside the zone
        is_command:
          type: boolean
          nullable: true
          description: Whether the pitch counted as a commanded pitch
        expected_woba:
          type: number
          nullable: true
          description: Expected weighted on-base value for the pitch outcome
        woba_value:
          type: number
          nullable: true
          description: Weighted on-base value for the pitch outcome
        woba_denom:
          type: number
          nullable: true
          description: Weighted on-base denominator for the pitch outcome
        expected_slugging:
          type: number
          nullable: true
          description: Expected slugging value for the pitch outcome
        game_pitch_count:
          type: integer
          nullable: true
          description: Total pitches in the game so far
        pitcher_pitch_count:
          type: integer
          nullable: true
          description: Pitcher's pitch count
    MLBPlateAppearance:
      type: object
      properties:
        batter_id:
          type: integer
          description: Player ID of the batter
        pitcher_id:
          type: integer
          description: Player ID of the pitcher
        inning:
          type: integer
        half_inning:
          type: string
          description: "\"top\" or \"bottom\""
        pa_number:
          type: integer
          description: Plate appearance number within the game
        outs:
          type: integer
          nullable: true
          description: Number of outs at the start of the plate appearance
        batter_side:
          type: string
          nullable: true
          description: Batter stance (L or R)
        pitcher_hand:
          type: string
          nullable: true
          description: Pitcher throwing hand (L or R)
        result:
          type: string
          nullable: true
          description: Outcome of the plate appearance (e.g., "Strikeout", "Single")
        is_ball_in_play_out:
          type: boolean
          nullable: true
        runner_on_first:
          type: boolean
          nullable: true
        runner_on_second:
          type: boolean
          nullable: true
        runner_on_third:
          type: boolean
          nullable: true
        pitches:
          type: array
          items:
            $ref: "#/components/schemas/MLBPitchDetail"
          description: Individual pitches in this plate appearance
    MLBPlay:
      type: object
      properties:
        game_id:
          type: integer
        order:
          type: integer
          description: Sequential play order number
        type:
          type: string
          nullable: true
          description: Type of play (e.g., "Start Batter/Pitcher", "Play Result", "Fly Out")
        text:
          type: string
          nullable: true
          description: Human-readable play description
        home_score:
          type: integer
        away_score:
          type: integer
        inning:
          type: integer
        inning_type:
          type: string
          nullable: true
          description: "\"Top\" or \"Bottom\""
        scoring_play:
          type: boolean
        score_value:
          type: integer
          nullable: true
        outs:
          type: integer
          nullable: true
        balls:
          type: integer
          nullable: true
        strikes:
          type: integer
          nullable: true
        batter_id:
          type: integer
          nullable: true
          description: Player ID of the batter
        pitcher_id:
          type: integer
          nullable: true
          description: Player ID of the pitcher
        pitch_type:
          type: string
          nullable: true
        pitch_velocity:
          type: number
          nullable: true
          description: Pitch velocity in mph
        hit_coordinate_x:
          type: number
          nullable: true
        hit_coordinate_y:
          type: number
          nullable: true
        trajectory:
          type: string
          nullable: true
          description: Hit trajectory (F=fly, G=ground, L=line drive)
    MLBGameLineup:
      type: object
      properties:
        id:
          type: integer
        game_id:
          type: integer
        player:
          $ref: "#/components/schemas/MLBPlayer"
        team:
          $ref: "#/components/schemas/MLBTeam"
        batting_order:
          type: integer
          nullable: true
          description: Batting order position (1-9), null for probable pitchers not in the batting lineup
        position:
          type: string
          nullable: true
          description: "Position abbreviation (SS, CF, DH, SP, etc.)"
        is_probable_pitcher:
          type: boolean
          description: Whether this player is the probable starting pitcher
    MLBPlayer:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
        debut_year:
          type: integer
          nullable: true
        jersey:
          type: string
        college:
          type: string
        position:
          type: string
        active:
          type: boolean
        birth_place:
          type: string
        dob:
          type: string
        age:
          type: integer
          nullable: true
        height:
          type: string
        weight:
          type: string
        draft:
          type: string
        bats_throws:
          type: string
        team:
          $ref: "#/components/schemas/MLBTeam"
    MLBPlayerProp:
      type: object
      properties:
        id:
          type: integer
        game_id:
          type: integer
        player_id:
          type: integer
        vendor:
          type: string
          enum:
            - betmgm
            - betrivers
            - caesars
            - draftkings
            - fanatics
            - fanduel
        prop_type:
          type: string
          description: Open-ended MLB player prop type. Common examples include hits, home_runs, total_bases, runs_scored, hits_runs_rbis, and pitcher_strikeouts.
        line_value:
          type: string
        market:
          type: object
          properties:
            type:
              type: string
              enum:
                - over_under
                - milestone
            over_odds:
              type: integer
              nullable: true
            under_odds:
              type: integer
              nullable: true
            odds:
              type: integer
              nullable: true
              description: Used for milestone market type
        updated_at:
          type: string
          format: date-time
    MLBSeasonStats:
      type: object
      properties:
        player:
          $ref: "#/components/schemas/MLBPlayer"
        team_name:
          type: string
        season:
          type: integer
        postseason:
          type: boolean
        season_type:
          type: string
          enum:
            - spring_training
            - regular
            - postseason
        batting_gp:
          type: integer
        batting_ab:
          type: integer
        batting_r:
          type: integer
        batting_h:
          type: integer
        batting_avg:
          type: number
        batting_2b:
          type: integer
        batting_3b:
          type: integer
        batting_hr:
          type: integer
        batting_rbi:
          type: integer
        batting_tb:
