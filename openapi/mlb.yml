              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Splits grouped by split_category (e.g., "split", "byDayMonth", "byOpponent")
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          player:
                            $ref: "#/components/schemas/MLBPlayer"
                          season:
                            type: integer
                          category:
