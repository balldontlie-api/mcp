  /mlb/v1/odds/player_props:
    get:
      summary: Get MLB player prop betting odds
      description: |
        Retrieve live player prop betting data for MLB games. Player prop data is LIVE and updated in real-time.
        We do not store historical data. As games near completion, many (or all) player props may be removed from sportsbooks.

        **Note:** This endpoint returns all player props for the specified game in a single response. Pagination is not supported.

        The API supports two market types:
        - **over_under**: Traditional over/under markets where users can bet on whether a player will go over or under a specific line value
        - **milestone**: Milestone markets where users bet on whether a player will reach a specific achievement

        Prop types are open-ended. Common examples include:
        - Batter props: hits, home_runs, total_bases, rbis, stolen_bases, singles, doubles, triples, walks, strikeouts, runs_scored, and hits_runs_rbis
        - Pitcher props: pitcher_strikeouts, pitcher_outs, pitcher_hits_allowed, pitcher_walks, pitcher_earned_runs, and pitcher_record_a_win

        Newly available compatible single-player markets can appear without a documentation enum update. Use `/mlb/v1/odds/markets` for the complete current market catalog, including structures that do not fit this simplified response.

        Available vendors: betmgm, betrivers, caesars, draftkings, fanatics, fanduel
      tags:
        - MLB
      parameters:
        - name: game_id
          in: query
          required: true
          schema:
            type: integer
          description: The game ID to retrieve player props for (required)
        - name: player_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter props for a specific player
        - name: prop_type
          in: query
          required: false
          schema:
            type: string
          description: Filter by an open-ended prop type string.
        - name: vendors
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - betmgm
                - betrivers
                - caesars
                - draftkings
                - fanatics
                - fanduel
          style: form
          explode: true
          description: Filter by specific sportsbook vendors (e.g., draftkings, fanduel). If not provided, returns props from all available vendors.
      responses:
        "200":
          description: MLB player prop betting odds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MLBPlayerProp"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /mlb/v1/odds/player_props/opening:
    get:
      summary: Get MLB opening player prop odds
      description: Retrieve historical opening player prop betting odds. Coverage is limited to the most recently completed season and ongoing seasons where available. Requires GOAT tier.
      tags:
        - MLB
      parameters:
        - name: game_id
