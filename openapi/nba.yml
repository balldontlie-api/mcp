openapi: 3.1.0
info:
  title: BALLDONTLIE - NBA API
  version: 1.0.0
  description: NBA endpoints for the BallDontLie API.
servers:
  - url: https://api.balldontlie.io
    description: Production server
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    CompetitionStatusState:
      type: string
      description: Normalized lifecycle state for cross-sport integrations. Classification may use the sport-specific lifecycle field and other available lifecycle context. `unknown` means the available lifecycle data cannot be safely classified.
      enum:
        - scheduled
        - in_progress
        - final
        - postponed
        - canceled
        - delayed
        - suspended
        - abandoned
        - unknown
    DfsSlate:
      type: object
      description: A provider-neutral DFS lineup pool and its lineup rules.
      required:
        - id
        - sport
        - provider
        - format
        - scope
        - style
        - salary_cap
        - event_count
        - starts_at
        - last_event_starts_at
        - status
        - allow_late_swap
        - active
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        sport:
          type: string
        provider:
          type: string
        format:
          type: string
          enum: [salary_cap, tiers, snake_draft]
        scope:
          type: string
          enum: [single_event, multi_event]
        style:
          type: string
        salary_cap:
          type: integer
          minimum: 0
          nullable: true
        event_count:
          type: integer
          minimum: 1
        starts_at:
          type: string
          format: date-time
        last_event_starts_at:
          type: string
          format: date-time
        status:
          type: string
        allow_late_swap:
          type: boolean
          nullable: true
        active:
          type: boolean
        updated_at:
          type: string
          format: date-time
    DfsSlateEvent:
      type: object
      description: A real game included in a DFS slate.
      required:
        - id
        - game_id
        - name
        - starts_at
        - away_team_abbreviation
        - home_team_abbreviation
        - active
      properties:
        id:
          type: integer
          minimum: 1
        game_id:
          type: integer
          minimum: 1
          nullable: true
          description: BALLDONTLIE game ID when a reference is available.
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        away_team_abbreviation:
          type: string
          nullable: true
        home_team_abbreviation:
          type: string
          nullable: true
        active:
          type: boolean
    DfsRosterSlot:
      type: object
      description: A lineup position required by a DFS slate.
      required:
        - id
        - name
        - description
        - instructions
        - required_count
        - display_order
        - active
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
          nullable: true
        instructions:
          type: string
          nullable: true
        required_count:
          type: integer
          minimum: 1
        display_order:
          type: integer
          minimum: 0
        active:
          type: boolean
    DfsSlateDetail:
      allOf:
        - $ref: "#/components/schemas/DfsSlate"
        - type: object
          required:
            - events
            - roster_slots
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/DfsSlateEvent"
            roster_slots:
              type: array
              items:
                $ref: "#/components/schemas/DfsRosterSlot"
    DfsDraftable:
      type: object
      description: A player or team that can be selected for a slate roster slot.
      required:
        - id
        - slate_id
        - slate_event_id
        - roster_slot_id
        - game_id
        - player_id
        - team_id
        - entity_type
        - first_name
        - last_name
        - display_name
        - short_name
        - position
        - salary
        - status
        - is_swappable
        - is_disabled
        - team_abbreviation
        - active
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        slate_id:
          type: integer
          minimum: 1
        slate_event_id:
          type: integer
          minimum: 1
        roster_slot_id:
          type: integer
          minimum: 1
        game_id:
          type: integer
          minimum: 1
          nullable: true
          description: BALLDONTLIE game ID when a reference is available.
        player_id:
          type: integer
          minimum: 1
          nullable: true
          description: BALLDONTLIE player ID when a reference is available.
        team_id:
          type: integer
          minimum: 1
          nullable: true
          description: BALLDONTLIE team ID when a reference is available.
        entity_type:
          type: string
          enum: [player, team]
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        display_name:
          type: string
        short_name:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        salary:
          type: integer
          minimum: 0
          nullable: true
        status:
          type: string
          nullable: true
        is_swappable:
          type: boolean
          nullable: true
        is_disabled:
          type: boolean
          nullable: true
        team_abbreviation:
          type: string
          nullable: true
        active:
          type: boolean
        updated_at:
          type: string
          format: date-time
    DfsPagination:
      type: object
      required:
        - per_page
      properties:
        prev_cursor:
          type: integer
          minimum: 1
          description: Present when the request supplied a cursor.
        next_cursor:
          type: integer
          minimum: 1
          description: Present when another page may be available.
        per_page:
          type: integer
          minimum: 1
          maximum: 100
    DfsSlateListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DfsSlate"
        meta:
          $ref: "#/components/schemas/DfsPagination"
    DfsSlateDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DfsSlateDetail"
    DfsDraftableListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DfsDraftable"
        meta:
          $ref: "#/components/schemas/DfsPagination"
    DfsValidationError:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - param
              - error
            properties:
              param:
                type: string
              error:
                type: string
    DfsServerError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: Internal Server Error
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
