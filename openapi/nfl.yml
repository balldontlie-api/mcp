  /nfl/v1/dfs/slates:
    get:
      summary: Get NFL DFS slates
      description: |
        Returns provider-neutral daily fantasy lineup pools and rules. A slate identifies
        its format, event window, salary cap, and whether it covers one or multiple games.
        Use the slate detail endpoint for included events and roster slots, then request
        draftables for selectable players or teams and their slate-specific salaries.
        Requires GOAT tier. Current slates are returned by default; use active=false for
        inactive historical snapshots.
      tags:
        - NFL
      parameters:
        - $ref: "#/components/parameters/DfsSlateIdsParam"
        - $ref: "#/components/parameters/DfsProvidersParam"
        - $ref: "#/components/parameters/DfsFormatsParam"
        - $ref: "#/components/parameters/DfsScopesParam"
        - $ref: "#/components/parameters/DfsActiveParam"
        - $ref: "#/components/parameters/DfsStartDateParam"
        - $ref: "#/components/parameters/DfsEndDateParam"
        - name: seasons[]
          in: query
          required: false
          description: Filter slates through linked NFL game seasons.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: weeks[]
          in: query
          required: false
          description: Filter slates through linked NFL game weeks.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - $ref: "#/components/parameters/DfsCursorParam"
        - $ref: "#/components/parameters/DfsPerPageParam"
      responses:
        "200":
          description: Paginated DFS slates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DfsSlateListResponse"
        "400":
          $ref: "#/components/responses/DfsBadRequest"
        "401":
          $ref: "#/components/responses/DfsUnauthorized"
        "429":
          $ref: "#/components/responses/DfsRateLimited"
        "500":
          $ref: "#/components/responses/DfsServerFailure"
  /nfl/v1/dfs/slates/{id}:
    get:
      summary: Get a NFL DFS slate
      description: |
        Returns one slate with its included real-game events and lineup roster slots.
        Event game_id values use BALLDONTLIE game IDs when a reference is available.
        The active flags preserve the state of historical slate members. Requires GOAT tier.
      tags:
        - NFL
      parameters:
        - name: id
          in: path
          required: true
          description: DFS slate ID.
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
      responses:
        "200":
          description: DFS slate detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DfsSlateDetailResponse"
        "400":
          $ref: "#/components/responses/DfsBadRequest"
        "401":
          $ref: "#/components/responses/DfsUnauthorized"
        "404":
          $ref: "#/components/responses/DfsNotFound"
        "429":
          $ref: "#/components/responses/DfsRateLimited"
        "500":
          $ref: "#/components/responses/DfsServerFailure"
  /nfl/v1/dfs/draftables:
    get:
      summary: Get NFL DFS draftables
      description: |
        Returns players or teams that can be selected for a slate roster slot, including
        position, salary, availability, and linked BALLDONTLIE entities when available.
        game_id, player_id, or team_id can be null when no reference is available.
        Current draftables are returned by default; use active=false for inactive history.
        Requires GOAT tier.
      tags:
        - NFL
      parameters:
        - $ref: "#/components/parameters/DfsSlateIdsParam"
        - $ref: "#/components/parameters/DfsGameIdsParam"
        - $ref: "#/components/parameters/DfsPlayerIdsParam"
        - $ref: "#/components/parameters/DfsTeamIdsParam"
        - $ref: "#/components/parameters/DfsPositionsParam"
        - $ref: "#/components/parameters/DfsActiveParam"
        - $ref: "#/components/parameters/DfsCursorParam"
        - $ref: "#/components/parameters/DfsPerPageParam"
      responses:
        "200":
          description: Paginated DFS draftables.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DfsDraftableListResponse"
        "400":
          $ref: "#/components/responses/DfsBadRequest"
        "401":
          $ref: "#/components/responses/DfsUnauthorized"
        "429":
          $ref: "#/components/responses/DfsRateLimited"
        "500":
          $ref: "#/components/responses/DfsServerFailure"
  /nfl/v1/plays:
    get:
      summary: Get NFL play-by-play data
      description: Retrieve play-by-play data for NFL games, ordered chronologically by wallclock time
      tags:
        - NFL
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PerPageParam"
        - name: game_id
          in: query
          required: true
          schema:
            type: integer
          description: Filter by game ID (required)
      responses:
        "200":
          description: NFL play-by-play data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NFLPlay"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
