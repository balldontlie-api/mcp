openapi: 3.1.0
info:
  title: BALLDONTLIE - NFL API
  version: 1.0.0
  description: NFL endpoints for the BallDontLie API.
servers:
  - url: https://api.balldontlie.io
    description: Production server
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    NFLPlayerDesignation:
      type: object
      description: >-
        Game-scoped player participation and availability. Practice participation,
        game availability, game-day active status, and completed-game participation
        describe different things. A player can miss practice and still play, or
        practice fully while having a reported injury. A player can be active but
        never enter the game (active is true and did_not_play is true). Null is not
        false. Practice reports and game designations can become available before
        game day; active status becomes available with game-day inactive
        announcements. Starter and did_not_play describe the completed game.
        Historical coverage varies by game and field; practice reports and active
        status may be unavailable even when starter and did_not_play are present.
      required: [id, season, week, season_type, game_id, player, team, practice_reports, injury, game_status, active, starter, did_not_play, updated_at]
      properties:
        id:
          type: integer
          description: Stable designation ID for the player and game.
        season:
          type: integer
          description: Season year of the game.
        week:
          type: integer
          description: Week number within the game's season phase.
        season_type:
          type: string
          description: Season phase of the game.
          enum: [preseason, regular, postseason]
        game_id:
          type: integer
          description: BALLDONTLIE game ID.
        player:
          description: Player profile, using a BALLDONTLIE player ID. The separate team field supplies the team for this game.
          $ref: "#/components/schemas/NFLFantasyPlayer"
        team:
          description: Team for this game, using a BALLDONTLIE team ID.
          $ref: "#/components/schemas/NFLTeam"
        practice_reports:
          type: array
          description: Daily practice participation for this game. An empty array means no daily reports are available; it does not establish that the player practiced or is healthy.
          items:
            type: object
            required: [date, status]
            properties:
              date:
                type: string
                format: date
                description: Date of the practice report (YYYY-MM-DD).
              status:
                type: string
                enum: [did_not_participate, limited, full]
                description: did_not_participate means no practice participation, limited means partial participation, and full means full participation. Missing practice does not mean the player will miss the game; full participation does not establish that the player is uninjured.
        injury:
          type: [string, "null"]
          description: Reported injury or reason for the player's designation. Null means no description is available, not that the player is uninjured.
        game_status:
          type: [string, "null"]
          enum: [questionable, doubtful, out, null]
          description: Reported availability designation for this game. questionable means participation is uncertain, doubtful means participation is unlikely, and out means the player will not play. Null means no game designation is available; it is not confirmation that the player will play.
        active:
          type: [boolean, "null"]
          description: Game-day active status. True means active, false means inactive, and null means not yet known or unavailable. Being active does not guarantee the player will enter the game.
        starter:
          type: [boolean, "null"]
          description: Actual starting status for the completed game. True means the player started, false means the player did not start, and null means not yet known or unavailable. This is not a projected starter.
        did_not_play:
          type: [boolean, "null"]
          description: Participation in the completed game. True means the player did not play, false means the player played, and null means not yet known or unavailable. This does not describe practice participation or establish inactive status.
        updated_at:
          type: string
          format: date-time
          description: Date and time the designation record was last updated, in ISO 8601 format. This is not necessarily the time an individual status changed.
    NFLFantasyTeam:
      type: object
      description: Team context for the fantasy record, using BALLDONTLIE IDs.
      required:
        - id
        - conference
        - division
        - location
        - name
        - full_name
        - abbreviation
      properties:
        id:
          type: integer
          minimum: 1
        conference:
          type: string
        division:
          type: string
        location:
          type: string
        name:
          type: string
        full_name:
          type: string
        abbreviation:
          type: string
    NFLFantasyPlayer:
      type: object
      description: Player identity using a BALLDONTLIE player ID. Team context is returned separately on the fantasy record.
      required:
        - id
        - first_name
        - last_name
        - position
        - position_abbreviation
        - height
        - weight
        - jersey_number
        - college
        - experience
        - age
      properties:
        id:
          type: integer
          minimum: 1
        first_name:
          type: string
        last_name:
          type: string
        position:
          type: string
        position_abbreviation:
          type: string
        height:
          type: string
          nullable: true
        weight:
          type: string
          nullable: true
        jersey_number:
          type: string
          nullable: true
        college:
          type: string
          nullable: true
        experience:
          type: string
          nullable: true
        age:
          type: integer
          nullable: true
    NFLFantasyGame:
      type: object
      description: NFL game context with BALLDONTLIE team and game IDs.
      required:
        - id
        - visitor_team
        - home_team
        - summary
        - venue
        - week
        - date
        - season
        - postseason
        - status
        - status_state
        - home_team_score
        - home_team_q1
        - home_team_q2
        - home_team_q3
        - home_team_q4
        - home_team_ot
        - visitor_team_score
        - visitor_team_q1
        - visitor_team_q2
        - visitor_team_q3
        - visitor_team_q4
        - visitor_team_ot
      properties:
        id:
          type: integer
          minimum: 1
        visitor_team:
          $ref: "#/components/schemas/NFLFantasyTeam"
        home_team:
          $ref: "#/components/schemas/NFLFantasyTeam"
        summary:
          type: string
          nullable: true
        venue:
          type: string
          nullable: true
        week:
          type: integer
          nullable: true
        date:
          type: string
          format: date-time
          nullable: true
        season:
          type: integer
        postseason:
          type: boolean
        status:
          type: string
          nullable: true
        status_state:
          $ref: "#/components/schemas/CompetitionStatusState"
        home_team_score:
          type: integer
          nullable: true
        home_team_q1:
          type: integer
          nullable: true
        home_team_q2:
          type: integer
          nullable: true
        home_team_q3:
          type: integer
          nullable: true
        home_team_q4:
          type: integer
          nullable: true
        home_team_ot:
          type: integer
          nullable: true
        visitor_team_score:
          type: integer
          nullable: true
        visitor_team_q1:
          type: integer
          nullable: true
        visitor_team_q2:
          type: integer
          nullable: true
        visitor_team_q3:
          type: integer
          nullable: true
        visitor_team_q4:
          type: integer
          nullable: true
        visitor_team_ot:
          type: integer
          nullable: true
    NFLFantasyScoringFormat:
      type: object
      description: A season-specific fantasy scoring definition. The rules object remains flexible so new scoring structures can be added without changing the envelope.
      required:
        - id
        - season
        - key
        - name
        - derived
        - rules
      properties:
        id:
          type: integer
          minimum: 1
        season:
          type: integer
        key:
          type: string
        name:
          type: string
        derived:
          type: boolean
          description: Whether this format was calculated from another available scoring definition.
        rules:
          type: object
          additionalProperties: true
          description: Flexible scoring-rule definition for this format and season. For each item, position_points[position] replaces points when present; it is not additive. is_reverse does not apply an extra sign change. schema_version identifies the rule structure, not a stats dictionary version.
    NFLFantasyStats:
      type: object
      description: Sparse stat-name to numeric-value map. Available stat names vary by position and data set. For weekly observations, omitted keys contribute zero to scoring but do not establish completeness. See the weekly stats endpoint for the scoring and availability contract.
      additionalProperties:
        type: number
    NFLFantasyEntity:
      type: object
      required:
        - id
        - season
        - week
        - date
        - player
        - team
        - game
        - position
        - collected_at
      properties:
        id:
          type: integer
          minimum: 1
          description: Fantasy record ID.
        season:
          type: integer
        week:
          type: integer
          nullable: true
          description: NFL week for weekly records; null for season records.
        date:
          type: string
          format: date
          nullable: true
          description: Exact historical snapshot date; null for the current snapshot.
        player:
          allOf:
            - $ref: "#/components/schemas/NFLFantasyPlayer"
          nullable: true
          description: Player identity, or null for a team defense/special-teams record.
        team:
          allOf:
            - $ref: "#/components/schemas/NFLFantasyTeam"
          nullable: true
          description: Team context for this fantasy snapshot.
        game:
          allOf:
            - $ref: "#/components/schemas/NFLFantasyGame"
          nullable: true
          description: Game context for weekly records; null for season records.
        position:
          type: string
          description: Fantasy position, such as QB, RB, WR, TE, K, or DST.
        collected_at:
          type: string
          format: date-time
          description: Collection time for this record, not the linked game's completion time.
    NFLFantasyProjectedPoints:
      type: object
      required:
        - id
        - scoring_format
        - total_points
        - points_per_game
      properties:
        id:
          type: integer
          minimum: 1
        scoring_format:
          $ref: "#/components/schemas/NFLFantasyScoringFormat"
        total_points:
          type: number
        points_per_game:
          type: number
          nullable: true
    NFLFantasyProjection:
      allOf:
        - $ref: "#/components/schemas/NFLFantasyEntity"
        - type: object
          required:
            - projected_games
            - stats
            - projections
          properties:
            projected_games:
              type: number
              nullable: true
              description: Projected games for a season record; 1 for a weekly projection.
            stats:
              allOf:
                - $ref: "#/components/schemas/NFLFantasyStats"
              nullable: true
            projections:
              type: array
              items:
                $ref: "#/components/schemas/NFLFantasyProjectedPoints"
    NFLFantasyWeeklyPoints:
      type: object
      required:
        - id
        - scoring_format
        - total_points
      properties:
        id:
          type: integer
          minimum: 1
        scoring_format:
          $ref: "#/components/schemas/NFLFantasyScoringFormat"
        total_points:
          type: number
    NFLFantasyWeeklyStat:
      allOf:
        - $ref: "#/components/schemas/NFLFantasyEntity"
        - type: object
          required:
            - week
            - game
            - stats
            - fantasy_points
          properties:
            week:
              type: integer
              minimum: 1
              maximum: 18
            game:
              $ref: "#/components/schemas/NFLFantasyGame"
            stats:
              $ref: "#/components/schemas/NFLFantasyStats"
            fantasy_points:
              type: array
              items:
                $ref: "#/components/schemas/NFLFantasyWeeklyPoints"
    NFLFantasyRank:
      type: object
      required:
        - id
        - type
        - overall_rank
        - position_rank
        - auction_value
      properties:
        id:
          type: integer
          minimum: 1
        type:
          type: string
        overall_rank:
          type: integer
          minimum: 1
        position_rank:
          type: number
          minimum: 1
          nullable: true
        auction_value:
          type: number
          nullable: true
    NFLFantasyRanking:
      allOf:
        - $ref: "#/components/schemas/NFLFantasyEntity"
        - type: object
          required:
            - rankings
          properties:
            rankings:
              type: array
              items:
                $ref: "#/components/schemas/NFLFantasyRank"
    NFLFantasyAdp:
      allOf:
        - $ref: "#/components/schemas/NFLFantasyEntity"
        - type: object
          required:
            - average_draft_position
            - average_draft_position_percent_change
            - average_auction_value
            - average_auction_value_change
            - percent_rostered
            - percent_started
            - percent_rostered_change
            - market_updated_at
          properties:
            average_draft_position:
              type: number
            average_draft_position_percent_change:
              type: number
              nullable: true
            average_auction_value:
              type: number
              nullable: true
            average_auction_value_change:
              type: number
              nullable: true
            percent_rostered:
              type: number
              nullable: true
            percent_started:
              type: number
              nullable: true
            percent_rostered_change:
              type: number
              nullable: true
            market_updated_at:
              type: string
              format: date-time
              nullable: true
    NFLFantasyScoringFormatListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NFLFantasyScoringFormat"
        meta:
          $ref: "#/components/schemas/Pagination"
    NFLFantasyProjectionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NFLFantasyProjection"
        meta:
          $ref: "#/components/schemas/Pagination"
    NFLFantasyWeeklyStatListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NFLFantasyWeeklyStat"
        meta:
          $ref: "#/components/schemas/Pagination"
    NFLFantasyRankingListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NFLFantasyRanking"
        meta:
          $ref: "#/components/schemas/Pagination"
    NFLFantasyAdpListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NFLFantasyAdp"
        meta:
          $ref: "#/components/schemas/Pagination"
    NFLFantasyValidationError:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [param, error]
            properties:
              param:
                type: string
              error:
                type: string
    NFLFantasyServerError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: Internal Server Error
    CompetitionStatusState:
      type: string
      description: Normalized lifecycle state for cross-sport integrations. Classification may use the sport-specific lifecycle field and other available lifecycle context. `unknown` means the available lifecycle data cannot be safely classified.
      enum:
        - scheduled
        - in_progress
        - final
        - postponed
        - canceled
        - delayed
        - suspended
        - abandoned
        - unknown
    DfsSlate:
      type: object
      description: A provider-neutral DFS lineup pool and its lineup rules.
      required:
        - id
        - sport
        - provider
        - format
        - scope
        - style
        - salary_cap
        - event_count
        - starts_at
        - last_event_starts_at
        - status
        - allow_late_swap
        - active
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        sport:
          type: string
        provider:
          type: string
        format:
          type: string
          enum: [salary_cap, tiers, snake_draft]
        scope:
          type: string
          enum: [single_event, multi_event]
        style:
          type: string
        salary_cap:
          type: integer
          minimum: 0
          nullable: true
        event_count:
          type: integer
          minimum: 1
        starts_at:
          type: string
          format: date-time
        last_event_starts_at:
          type: string
          format: date-time
        status:
          type: string
        allow_late_swap:
          type: boolean
          nullable: true
        active:
          type: boolean
        updated_at:
          type: string
          format: date-time
    DfsSlateEvent:
      type: object
      description: A real game included in a DFS slate.
      required:
        - id
        - game_id
        - name
        - starts_at
        - away_team_abbreviation
        - home_team_abbreviation
        - active
      properties:
        id:
          type: integer
          minimum: 1
        game_id:
          type: integer
          minimum: 1
          nullable: true
          description: BALLDONTLIE game ID when a reference is available.
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        away_team_abbreviation:
          type: string
          nullable: true
        home_team_abbreviation:
          type: string
          nullable: true
        active:
          type: boolean
    DfsRosterSlot:
      type: object
      description: A lineup position required by a DFS slate.
      required:
        - id
        - name
        - description
        - instructions
        - required_count
        - display_order
        - active
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
          nullable: true
        instructions:
          type: string
          nullable: true
        required_count:
          type: integer
          minimum: 1
        display_order:
          type: integer
          minimum: 0
        active:
          type: boolean
    DfsSlateDetail:
      allOf:
        - $ref: "#/components/schemas/DfsSlate"
        - type: object
          required:
            - events
            - roster_slots
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/DfsSlateEvent"
            roster_slots:
              type: array
              items:
                $ref: "#/components/schemas/DfsRosterSlot"
    DfsDraftable:
      type: object
      description: A player or team that can be selected for a slate roster slot.
      required:
        - id
        - slate_id
        - slate_event_id
        - roster_slot_id
        - game_id
        - player_id
        - team_id
        - entity_type
        - first_name
        - last_name
        - display_name
        - short_name
        - position
        - salary
        - status
        - is_swappable
        - is_disabled
        - team_abbreviation
        - active
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        slate_id:
          type: integer
          minimum: 1
        slate_event_id:
          type: integer
          minimum: 1
        roster_slot_id:
          type: integer
          minimum: 1
        game_id:
          type: integer
          minimum: 1
          nullable: true
          description: BALLDONTLIE game ID when a reference is available.
        player_id:
          type: integer
          minimum: 1
          nullable: true
          description: BALLDONTLIE player ID when a reference is available.
        team_id:
          type: integer
          minimum: 1
          nullable: true
          description: BALLDONTLIE team ID when a reference is available.
        entity_type:
          type: string
          enum: [player, team]
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        display_name:
          type: string
        short_name:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        salary:
          type: integer
          minimum: 0
          nullable: true
        status:
          type: string
          nullable: true
        is_swappable:
          type: boolean
          nullable: true
        is_disabled:
          type: boolean
          nullable: true
        team_abbreviation:
          type: string
          nullable: true
        active:
          type: boolean
        updated_at:
          type: string
          format: date-time
    DfsPagination:
      type: object
      required:
        - per_page
      properties:
        prev_cursor:
          type: integer
          minimum: 1
          description: Present when the request supplied a cursor.
        next_cursor:
          type: integer
          minimum: 1
          description: Present when another page may be available.
        per_page:
          type: integer
          minimum: 1
          maximum: 100
    DfsSlateListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DfsSlate"
        meta:
          $ref: "#/components/schemas/DfsPagination"
    DfsSlateDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DfsSlateDetail"
    DfsDraftableListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DfsDraftable"
        meta:
          $ref: "#/components/schemas/DfsPagination"
    DfsValidationError:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - param
              - error
            properties:
              param:
                type: string
              error:
                type: string
    DfsServerError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: Internal Server Error
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
    NFLAdvancedPassingStats:
      type: object
      properties:
        player:
          $ref: "#/components/schemas/NFLPlayer"
        season:
          type: integer
        week:
          type: integer
        postseason:
          type: boolean
        aggressiveness:
          type: number
        attempts:
          type: integer
        avg_air_distance:
          type: number
        avg_air_yards_differential:
          type: number
        avg_air_yards_to_sticks:
          type: number
        avg_completed_air_yards:
          type: number
        avg_intended_air_yards:
          type: number
        avg_time_to_throw:
          type: number
        completion_percentage:
          type: number
        completion_percentage_above_expectation:
          type: number
        completions:
          type: integer
        expected_completion_percentage:
          type: number
        games_played:
          type: number
        interceptions:
          type: number
        max_air_distance:
          type: number
        max_completed_air_distance:
          type: number
        pass_touchdowns:
          type: number
        pass_yards:
          type: number
        passer_rating:
          type: number
    NFLAdvancedReceivingStats:
      type: object
      properties:
        player:
          $ref: "#/components/schemas/NFLPlayer"
        season:
          type: integer
        week:
          type: integer
        postseason:
          type: boolean
        avg_cushion:
          type: number
        avg_expected_yac:
          type: number
        avg_intended_air_yards:
          type: number
        avg_separation:
          type: number
        avg_yac:
          type: number
        avg_yac_above_expectation:
          type: number
        catch_percentage:
          type: number
        percent_share_of_intended_air_yards:
          type: number
        rec_touchdowns:
          type: integer
        receptions:
          type: integer
        targets:
          type: integer
        yards:
          type: integer
    NFLAdvancedRushingStats:
      type: object
      properties:
        player:
          $ref: "#/components/schemas/NFLPlayer"
        season:
          type: integer
        week:
          type: integer
        postseason:
          type: boolean
        avg_time_to_los:
          type: number
        expected_rush_yards:
          type: number
        rush_attempts:
          type: integer
        rush_pct_over_expected:
          type: number
        rush_touchdowns:
          type: integer
        rush_yards:
          type: integer
        rush_yards_over_expected:
          type: number
        rush_yards_over_expected_per_att:
          type: number
        efficiency:
          type: number
        percent_attempts_gte_eight_defenders:
          type: number
        avg_rush_yards:
          type: number
    NFLBettingOdd:
      type: object
      properties:
        id:
          type: integer
          description: Betting odd ID
        game_id:
          type: integer
          description: Game ID
        vendor:
          type: string
          description: Sportsbook vendor name
        spread_home_value:
          type: string
          nullable: true
          description: Home team spread value
        spread_home_odds:
          type: integer
          nullable: true
          description: Home team spread odds
        spread_away_value:
          type: string
          nullable: true
          description: Away team spread value
