security:
  - ApiKeyAuth: []
paths:
  /nfl/v1/player_designations:
    get:
      summary: Get NFL player designations
      description: Requires GOAT access. Returns one row per player and game in the selected week. Supply season and week together; season_types defaults to [2] for an explicit week. When all three are omitted, the next unfinished game determines the current season, phase, and week, excluding canceled and postponed games. season_types requires season and week. Teams on bye have no rows. Historical coverage varies by game and field.
      tags: [NFL]
      parameters:
        - name: season
          in: query
          schema:
            type: integer
          description: Season year; must be supplied with week.
        - name: week
          in: query
          schema:
            type: integer
          description: Week number within the selected season phase; must be supplied with season.
        - name: season_types[]
          in: query
          schema:
            type: array
            items:
              type: integer
              enum: [1, 2, 3]
          style: form
          explode: true
          description: "Season types: 1 = preseason, 2 = regular season, 3 = postseason; requires season and week. Defaults to [2] for an explicit season and week."
        - $ref: "#/components/parameters/TeamIdsParam"
        - $ref: "#/components/parameters/CursorParam"
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Player designations for the requested week
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NFLPlayerDesignation"
                  meta:
                    $ref: "#/components/schemas/Pagination"
              example:
                {
                  "data": [
                    {
                      "id": 22474,
                      "season": 2025,
                      "week": 5,
                      "season_type": "postseason",
                      "game_id": 1341307,
                      "player": {
                        "id": 279866,
                        "first_name": "Drake",
                        "last_name": "Maye",
                        "position": "Quarterback",
                        "position_abbreviation": "QB",
                        "height": "6' 4\"",
                        "weight": "225 lbs",
                        "jersey_number": "10",
                        "college": "North Carolina",
                        "experience": "3rd Season",
                        "age": 24
                      },
                      "team": {
                        "id": 1,
                        "conference": "AFC",
                        "division": "EAST",
                        "location": "New England",
                        "name": "Patriots",
                        "full_name": "New England Patriots",
                        "abbreviation": "NE"
                      },
                      "practice_reports": [],
                      "injury": null,
                      "game_status": null,
                      "active": null,
                      "starter": true,
                      "did_not_play": false,
                      "updated_at": "2026-09-02T01:29:54.627Z"
                    }
                  ],
                  "meta": {
                    "per_page": 100
                  }
                }
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
