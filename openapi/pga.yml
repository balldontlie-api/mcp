        - PGA Tour v2
      parameters:
        - $ref: "#/components/parameters/V2CursorParam"
        - $ref: "#/components/parameters/V2PerPageParam"
        - name: tournament_ids[]
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
          description: Filter by tournament IDs.
        - name: season
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: Filter by season year.
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter by tournament status.
        - name: include_format
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Add format_type to each tournament. Omit this parameter to preserve the original v2 tournament shape.
