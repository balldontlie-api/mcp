openapi: 3.1.0
info:
  title: BALLDONTLIE - PGA Tour API
  version: 1.0.0
  description: PGA Tour endpoints for the BallDontLie API.
servers:
  - url: https://api.balldontlie.io
    description: Production server
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
    PGACourse:
      type: object
      properties:
        id:
          type: integer
          description: Course ID
        name:
          type: string
          description: Course name
        city:
          type: string
          nullable: true
          description: Course city
        state:
          type: string
          nullable: true
          description: Course state
        country:
          type: string
          nullable: true
          description: Course country
        par:
          type: integer
          nullable: true
          description: Course par
        yardage:
          type: string
          nullable: true
          description: Course yardage
        established:
          type: string
          nullable: true
          description: Year established
        architect:
          type: string
          nullable: true
          description: Course architect
        fairway_grass:
          type: string
          nullable: true
          description: Fairway grass type
        rough_grass:
          type: string
          nullable: true
          description: Rough grass type
        green_grass:
          type: string
          nullable: true
          description: Green grass type
    PGACourseHole:
      type: object
      properties:
        course:
          $ref: "#/components/schemas/PGACourse"
        hole_number:
          type: integer
          description: Hole number (1-18)
        par:
          type: integer
          description: Hole par
        yardage:
          type: integer
          nullable: true
          description: Hole yardage
    PGAFuturesOdd:
      type: object
      description: PGA futures betting odds (tournament winner, etc.)
      properties:
        id:
          type: integer
          description: Unique futures odd ID
        market_type:
          type: string
          description: Type of futures market (e.g., tournament_winner)
        market_name:
          type: string
          description: Display name of the futures market
        player:
          $ref: "#/components/schemas/PGAPlayer"
          nullable: true
          description: Player this futures odd is for
        tournament:
          $ref: "#/components/schemas/PGATournament"
          nullable: true
          description: Tournament this futures odd is for
        vendor:
          type: string
          description: Sportsbook vendor name
        american_odds:
          type: integer
          nullable: true
          description: American odds format
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Last update timestamp
    PGAPlayer:
      type: object
      properties:
        id:
          type: integer
          description: Player ID
        first_name:
          type: string
          nullable: true
          description: Player first name
        last_name:
          type: string
          nullable: true
          description: Player last name
        display_name:
          type: string
          description: Player display name
        country:
          type: string
          nullable: true
          description: Player country
        country_code:
          type: string
          nullable: true
          description: Country code (e.g., "USA")
        height:
          type: string
          nullable: true
          description: Player height
        weight:
          type: string
          nullable: true
          description: Player weight
        birth_date:
          type: string
          nullable: true
          description: Player birth date
        birthplace_city:
          type: string
          nullable: true
          description: Birthplace city
        birthplace_state:
          type: string
          nullable: true
          description: Birthplace state
        birthplace_country:
          type: string
          nullable: true
          description: Birthplace country
        turned_pro:
          type: string
          nullable: true
          description: Year turned professional
        school:
          type: string
          nullable: true
          description: College/university attended
        residence_city:
          type: string
          nullable: true
          description: Current residence city
        residence_state:
          type: string
          nullable: true
          description: Current residence state
        residence_country:
          type: string
          nullable: true
          description: Current residence country
        owgr:
          type: integer
          nullable: true
          description: Official World Golf Ranking
        active:
          type: boolean
          description: Whether player is active
    PGAPlayerRoundResult:
      type: object
      properties:
        tournament:
          $ref: "#/components/schemas/PGATournament"
        player:
          $ref: "#/components/schemas/PGAPlayer"
        round_number:
          type: integer
          description: Round number (1-4)
        score:
          type: integer
          nullable: true
          description: Round score (strokes)
        par_relative_score:
          type: integer
          nullable: true
          description: Score relative to par for the round
    PGAPlayerRoundStats:
      type: object
      properties:
        tournament:
          $ref: "#/components/schemas/PGATournament"
        player:
          $ref: "#/components/schemas/PGAPlayer"
        round_number:
          type: integer
          description: Round number (1-4, -1 for tournament total)
        sg_off_tee:
          type: number
          nullable: true
          description: Strokes Gained - Off the Tee
        sg_off_tee_rank:
          type: integer
          nullable: true
        sg_approach:
          type: number
          nullable: true
          description: Strokes Gained - Approach
        sg_approach_rank:
          type: integer
          nullable: true
        sg_around_green:
          type: number
          nullable: true
          description: Strokes Gained - Around the Green
        sg_around_green_rank:
          type: integer
          nullable: true
        sg_putting:
          type: number
          nullable: true
          description: Strokes Gained - Putting
        sg_putting_rank:
          type: integer
          nullable: true
        sg_total:
          type: number
          nullable: true
          description: Strokes Gained - Total
        sg_total_rank:
          type: integer
          nullable: true
        driving_accuracy:
          type: number
          nullable: true
        driving_accuracy_rank:
          type: integer
          nullable: true
        driving_distance:
          type: number
          nullable: true
        driving_distance_rank:
          type: integer
          nullable: true
        longest_drive:
          type: number
          nullable: true
        longest_drive_rank:
          type: integer
          nullable: true
        greens_in_regulation:
          type: number
          nullable: true
        greens_in_regulation_rank:
          type: integer
          nullable: true
        sand_saves:
          type: number
          nullable: true
        sand_saves_rank:
          type: integer
          nullable: true
        scrambling:
          type: number
          nullable: true
        scrambling_rank:
          type: integer
          nullable: true
        putts_per_gir:
          type: number
          nullable: true
        putts_per_gir_rank:
          type: integer
          nullable: true
        eagles:
          type: integer
          nullable: true
        birdies:
          type: integer
          nullable: true
        pars:
          type: integer
          nullable: true
        bogeys:
          type: integer
          nullable: true
        double_bogeys:
          type: integer
          nullable: true
    PGAPlayerScorecard:
      type: object
      properties:
        tournament:
          $ref: "#/components/schemas/PGATournament"
        player:
          $ref: "#/components/schemas/PGAPlayer"
        course:
          $ref: "#/components/schemas/PGACourse"
          nullable: true
          description: Course played for this round (useful for multi-course tournaments)
        round_number:
          type: integer
          description: Round number (1-4)
        hole_number:
          type: integer
          description: Hole number (1-18)
        par:
          type: integer
          description: Hole par
        score:
          type: integer
          nullable: true
          description: Player score on the hole
    PGAPlayerSeasonStat:
      type: object
      properties:
        player:
          $ref: "#/components/schemas/PGAPlayer"
        stat_id:
          type: integer
          description: Stat category ID
        stat_name:
          type: string
          description: Stat category name
        stat_category:
          type: string
          nullable: true
          description: Stat category type
        season:
          type: integer
          description: Season year
        rank:
          type: integer
          nullable: true
          description: Player rank for this stat
        stat_value:
          type: array
          nullable: true
          description: Stat value data
          items:
            type: object
            properties:
              statName:
                type: string
              statValue:
                type: string
    PGATournament:
      type: object
      required: [id, season, name, start_date, end_date, city, state, country, course_name, purse, status, status_state, champion, courses, rounds]
      properties:
        id:
          type: integer
          description: Tournament ID
        season:
          type: integer
          description: Season year
        name:
          type: string
          description: Tournament name
        start_date:
          type: string
          format: date-time
          description: Tournament start date
        end_date:
          type: string
          nullable: true
          description: Tournament end date
        city:
          type: string
          nullable: true
          description: Tournament city
        state:
          type: string
          nullable: true
          description: Tournament state
        country:
          type: string
          nullable: true
          description: Tournament country
        course_name:
          type: string
          nullable: true
          description: Course name
        purse:
          type: string
          nullable: true
          description: Tournament purse
        status:
          type: string
          nullable: true
          description: Tournament status (COMPLETED, IN_PROGRESS, SCHEDULED, NOT_STARTED)
        status_state:
          $ref: "#/components/schemas/PGAStatusState"
        champion:
          $ref: "#/components/schemas/PGAPlayer"
          nullable: true
        courses:
          type: array
          description: Courses used in this tournament with which rounds they are played
          items:
            $ref: "#/components/schemas/PGATournamentCourse"
        rounds:
          type: array
          description: >
            Per-round state. A `status` of `SUSPENDED` indicates play has been paused
            (typically weather or darkness). Empty array when no round data is available yet.
          items:
            $ref: "#/components/schemas/PGATournamentRound"
    PGATournamentV2:
      type: object
      required: [id, season, name, start_date, end_date, date_range, city, state, country, course_name, purse, status, status_state, champion, courses, rounds]
      properties:
        id:
          type: integer
          description: Tournament ID
        season:
          type: integer
          description: Season year
        name:
          type: string
          description: Tournament name
        start_date:
          type: string
          format: date
          description: Tournament start date
        end_date:
          type: string
          format: date
          nullable: true
          description: Tournament end date
        date_range:
          type: string
          nullable: true
          description: Display date range for the tournament
        city:
          type: string
          nullable: true
          description: Tournament city
        state:
          type: string
          nullable: true
          description: Tournament state
        country:
          type: string
          nullable: true
          description: Tournament country
        course_name:
          type: string
          nullable: true
          description: Course name
        purse:
          type: string
          nullable: true
          description: Tournament purse
        status:
          type: string
          nullable: true
          description: Tournament status (COMPLETED, IN_PROGRESS, SCHEDULED, NOT_STARTED)
        status_state:
          $ref: "#/components/schemas/PGAStatusState"
        champion:
          $ref: "#/components/schemas/PGAPlayer"
          nullable: true
        courses:
          type: array
          description: Courses used in this tournament with which rounds they are played
          items:
            $ref: "#/components/schemas/PGATournamentCourse"
        rounds:
          type: array
          description: >
            Per-round state. A `status` of `SUSPENDED` indicates play has been paused
            (typically weather or darkness). Empty array when no round data is available yet.
          items:
            $ref: "#/components/schemas/PGATournamentRound"
        format_type:
          $ref: "#/components/schemas/PGAFormatType"
          nullable: true
          description: Present only when include_format=true.
    PGAStatusState:
      type: string
      description: Normalized lifecycle state for cross-sport integrations. Classification may use `status` and other available lifecycle context; `status` remains unchanged. `unknown` means the available lifecycle data cannot be safely classified.
      enum:
        - scheduled
        - in_progress
        - final
        - postponed
        - canceled
        - delayed
        - suspended
        - abandoned
        - unknown
    PGAFormatType:
      type: string
      description: Tournament competition format.
      enum:
        - STROKE_PLAY
        - TEAM_STROKE
        - MATCH_PLAY
        - TEAM_CUP
        - UNKNOWN_SPECIAL_FORMAT
    PGATournamentRound:
      type: object
      description: State of a single round within a tournament
      required: [round_number, status, status_state]
      properties:
        round_number:
          type: integer
          description: 1-based round number within the tournament
        status:
          type: string
          nullable: true
          enum:
            - UPCOMING
            - IN_PROGRESS
            - SUSPENDED
            - COMPLETE
            - OFFICIAL
            - GROUPINGS_OFFICIAL
          description: Round status from the PGA Tour feed
        status_state:
          $ref: "#/components/schemas/PGAStatusState"
    PGATournamentCourse:
      type: object
      description: A course used in a tournament with the rounds it is played
      required: [course, rounds]
      properties:
        course:
          $ref: "#/components/schemas/PGACourse"
        rounds:
          type: array
          description: Round numbers this course is used for (e.g., [1,2,3] for first 3 rounds)
          items:
            type: integer
    PGAPlayerSummaryV2:
      type: object
      required: [id, first_name, last_name, display_name, country, country_code]
      properties:
        id:
          type: integer
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        display_name:
          type: string
        country:
          type: string
          nullable: true
        country_code:
          type: string
          nullable: true
    PGACourseSummaryV2:
      type: object
      required: [id, name, city, state, country, par, yardage]
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        par:
          type: integer
          nullable: true
        yardage:
          type: string
          nullable: true
    PGATournamentSummaryV2:
      type: object
      required: [id, name, format_type]
      properties:
        id:
          type: integer
        name:
          type: string
        format_type:
          $ref: "#/components/schemas/PGAFormatType"
          nullable: true
    PGACompetitorTypeV2:
      type: string
      enum: [PLAYER, TEAM, CUP_TEAM, PAIRING]
    PGACompetitorSummaryV2:
      type: object
      required: [id, type, display_name, parent_competitor_id, player]
      properties:
        id:
          type: integer
        type:
          $ref: "#/components/schemas/PGACompetitorTypeV2"
        display_name:
          type: string
        parent_competitor_id:
          type: integer
          nullable: true
        player:
          $ref: "#/components/schemas/PGAPlayerSummaryV2"
          nullable: true
    PGACompetitorMemberV2:
      type: object
      required: [player, display_order, role]
      properties:
        player:
          $ref: "#/components/schemas/PGAPlayerSummaryV2"
        display_order:
          type: integer
        role:
          type: string
          nullable: true
    PGACupRosterMemberV2:
      type: object
      required: [player, display_name, role, display_order]
      properties:
        player:
          $ref: "#/components/schemas/PGAPlayerSummaryV2"
          nullable: true
        display_name:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        display_order:
          type: integer
          nullable: true
    PGATournamentCompetitorV2:
      type: object
      required: [id, tournament_id, type, display_name, short_name, country, country_code, team_name, team_color, parent_competitor_id, player, members, roster]
      properties:
        id:
          type: integer
        tournament_id:
          type: integer
        type:
          $ref: "#/components/schemas/PGACompetitorTypeV2"
        display_name:
          type: string
        short_name:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        country_code:
          type: string
          nullable: true
        team_name:
          type: string
          nullable: true
        team_color:
          type: string
          nullable: true
        parent_competitor_id:
          type: integer
          nullable: true
        player:
          $ref: "#/components/schemas/PGAPlayerSummaryV2"
          nullable: true
        members:
          type: array
          items:
            $ref: "#/components/schemas/PGACompetitorMemberV2"
        roster:
          type: array
          items:
            $ref: "#/components/schemas/PGACupRosterMemberV2"
    PGAResultRoundV2:
      type: object
      required: [id, round_number, round_format, score, par_relative_score, points, score_display, status, tee_time, starting_hole]
      properties:
        id:
          type: integer
        round_number:
          type: integer
        round_format:
          type: string
          nullable: true
        score:
          type: integer
          nullable: true
        par_relative_score:
          type: integer
          nullable: true
        points:
          type: number
          nullable: true
        score_display:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        tee_time:
          type: string
          format: date-time
          nullable: true
        starting_hole:
          type: integer
          nullable: true
    PGATournamentResultV2:
      type: object
      required: [id, tournament, competitor, position, position_numeric, status, scoring, earnings, made_cut, thru, current_round, group_number, tee_time, course, result, rounds]
      properties:
        id:
          type: integer
        tournament:
          $ref: "#/components/schemas/PGATournamentSummaryV2"
        competitor:
          $ref: "#/components/schemas/PGACompetitorSummaryV2"
        position:
          type: string
          nullable: true
        position_numeric:
          type: integer
          nullable: true
        status:
          type: string
          nullable: true
        scoring:
          type: object
          required: [strokes, to_par, points, score_display]
          properties:
            strokes:
              type: integer
              nullable: true
            to_par:
              type: integer
              nullable: true
            points:
              type: number
              nullable: true
            score_display:
              type: string
              nullable: true
        earnings:
          type: number
          nullable: true
        made_cut:
          type: boolean
          nullable: true
        thru:
          type: string
          nullable: true
        current_round:
          type: integer
          nullable: true
        group_number:
          type: integer
          nullable: true
        tee_time:
          type: string
          format: date-time
          nullable: true
        course:
          $ref: "#/components/schemas/PGACourseSummaryV2"
          nullable: true
        result:
          type: string
          nullable: true
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/PGAResultRoundV2"
    PGATournamentRoundV2:
      type: object
      required: [id, tournament_id, round_number, status, status_state, round_format, course]
      properties:
        id:
          type: integer
        tournament_id:
          type: integer
        round_number:
          type: integer
        status:
          type: string
          nullable: true
        status_state:
          $ref: "#/components/schemas/PGAStatusState"
        round_format:
          type: string
          nullable: true
        course:
          $ref: "#/components/schemas/PGACourseSummaryV2"
          nullable: true
    PGATeeParticipantV2:
      type: object
      required: [id, display_order, competitor, player]
      properties:
        id:
          type: integer
        display_order:
          type: integer
        competitor:
          $ref: "#/components/schemas/PGACompetitorSummaryV2"
        player:
          $ref: "#/components/schemas/PGAPlayerSummaryV2"
          nullable: true
    PGATeeGroupV2:
      type: object
      required: [id, tournament_id, round_number, group_number, tee_time, start_tee, back_nine, round_format, status, state, course, match_id, participants]
      properties:
        id:
          type: integer
        tournament_id:
          type: integer
        round_number:
          type: integer
        group_number:
          type: integer
          nullable: true
        tee_time:
          type: string
          format: date-time
          nullable: true
        start_tee:
          type: integer
          nullable: true
        back_nine:
          type: boolean
        round_format:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        course:
          $ref: "#/components/schemas/PGACourseSummaryV2"
          nullable: true
        match_id:
          type: integer
          nullable: true
        participants:
          type: array
          items:
            $ref: "#/components/schemas/PGATeeParticipantV2"
    PGAMatchSideV2:
      type: object
      required: [id, side_index, competitor, team, score, score_numeric, status, result, points_awarded, seed, bracket_seed, record]
      properties:
        id:
          type: integer
        side_index:
          type: integer
        competitor:
          $ref: "#/components/schemas/PGACompetitorSummaryV2"
        team:
          $ref: "#/components/schemas/PGACompetitorSummaryV2"
          nullable: true
        score:
          type: string
          nullable: true
        score_numeric:
          type: number
          nullable: true
        status:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        points_awarded:
          type: number
          nullable: true
        seed:
          type: string
          nullable: true
        bracket_seed:
          type: string
          nullable: true
        record:
          type: string
          nullable: true
    PGATournamentMatchV2:
      type: object
      required: [id, tournament, round_number, round_display, round_format, bracket_number, bracket_name, title, display_score, match_score, status, thru, holes_played, tee_time, starting_tee, location, location_description, sides]
      properties:
        id:
          type: integer
        tournament:
          $ref: "#/components/schemas/PGATournamentSummaryV2"
        round_number:
          type: integer
        round_display:
          type: string
          nullable: true
        round_format:
          type: string
          nullable: true
        bracket_number:
          type: integer
          nullable: true
        bracket_name:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        display_score:
          type: string
          nullable: true
        match_score:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        thru:
          type: string
          nullable: true
        holes_played:
          type: integer
          nullable: true
        tee_time:
          type: string
          format: date-time
          nullable: true
        starting_tee:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        location_description:
          type: string
          nullable: true
        sides:
          type: array
          items:
            $ref: "#/components/schemas/PGAMatchSideV2"
    PGAMatchHoleScoreV2:
      type: object
      required: [id, side_id, side_index, scope, competitor, player, course_hole_number, par, score, score_display, status, result]
      properties:
        id:
          type: integer
        side_id:
          type: integer
        side_index:
          type: integer
        scope:
          type: string
        competitor:
          $ref: "#/components/schemas/PGACompetitorSummaryV2"
          nullable: true
        player:
          $ref: "#/components/schemas/PGAPlayerSummaryV2"
          nullable: true
        course_hole_number:
          type: integer
          nullable: true
        par:
          type: integer
          nullable: true
        score:
          type: integer
          nullable: true
        score_display:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
    PGAMatchHoleV2:
      type: object
      required: [id, match_id, hole_number, course_hole_number, par, status, display_value, scores]
      properties:
        id:
          type: integer
        match_id:
          type: integer
        hole_number:
          type: integer
        course_hole_number:
          type: integer
          nullable: true
        par:
          type: integer
          nullable: true
        status:
          type: string
          nullable: true
        display_value:
          type: string
          nullable: true
        scores:
          type: array
          items:
            $ref: "#/components/schemas/PGAMatchHoleScoreV2"
    PGATeeTime:
      type: object
      properties:
        id:
          type: integer
          description: Tee time entry ID
        round_number:
          type: integer
          description: Round number (1-4)
        group_number:
          type: integer
          description: Group number within the round
        tee_time:
          type: string
          format: date-time
          nullable: true
          description: Tee time in UTC (ISO 8601)
        start_tee:
          type: integer
          nullable: true
          description: Starting tee (1 or 10)
        back_nine:
          type: boolean
          description: Whether the group starts on the back nine
        player:
          $ref: "#/components/schemas/PGAPlayer"
        tournament:
          $ref: "#/components/schemas/PGATournament"
        course:
          $ref: "#/components/schemas/PGACourse"
          nullable: true
          description: Course assignment (useful for multi-course tournaments)
    PGATournamentCourseStats:
      type: object
      properties:
        tournament:
          $ref: "#/components/schemas/PGATournament"
        course:
          $ref: "#/components/schemas/PGACourse"
        hole_number:
          type: integer
          description: Hole number (1-18)
        round_number:
          type: integer
          nullable: true
          description: Round number (null for tournament total)
        scoring_average:
          type: number
          nullable: true
          description: Scoring average for the hole
        scoring_diff:
          type: number
          nullable: true
          description: Scoring difference from par
        difficulty_rank:
          type: integer
          nullable: true
          description: Hole difficulty rank (1 = hardest)
        eagles:
          type: integer
          nullable: true
        birdies:
          type: integer
          nullable: true
        pars:
          type: integer
          nullable: true
        bogeys:
          type: integer
          nullable: true
        double_bogeys:
          type: integer
          nullable: true
    PGATournamentField:
      type: object
      properties:
        id:
          type: integer
          description: Tournament field entry ID
        tournament:
          $ref: "#/components/schemas/PGATournament"
        player:
          $ref: "#/components/schemas/PGAPlayer"
        entry_status:
          type: string
          nullable: true
          description: Entry status (e.g., "IN")
        qualifier:
          type: string
          nullable: true
          description: How the player qualified (e.g., "Current Tournament Winners")
        owgr:
          type: integer
          nullable: true
          description: Official World Golf Ranking at time of entry
        is_amateur:
          type: boolean
          nullable: true
          description: Whether the player is an amateur
    PGATournamentResult:
      type: object
      properties:
        tournament:
          $ref: "#/components/schemas/PGATournament"
        player:
          $ref: "#/components/schemas/PGAPlayer"
        position:
          type: string
          nullable: true
          description: Final position (e.g., "1", "T5", "CUT", "WD")
        position_numeric:
          type: integer
          nullable: true
          description: Numeric position for sorting
        total_score:
          type: integer
          nullable: true
          description: Total strokes
        par_relative_score:
          type: integer
          nullable: true
          description: Score relative to par
        earnings:
          type: number
          nullable: true
          description: Player earnings in dollars
    Pagination:
      type: object
      properties:
        next_cursor:
          type: integer
          description: Cursor for the next page of results
        prev_cursor:
          type: integer
          nullable: true
          description: Cursor for the previous page of results
        per_page:
          type: integer
          description: Number of results per page
    PGAPlayerProp:
      type: object
      description: PGA player prop betting data
      required:
        - id
        - game_id
        - player_id
        - vendor
        - prop_type
        - line_value
        - market
        - updated_at
      properties:
        id:
          type: integer
          description: Unique player prop ID
        game_id:
          type: integer
          description: PGA tournament ID
        player_id:
          type: integer
          description: PGA player ID
        vendor:
          type: string
          description: Sportsbook vendor name
          enum:
            - fanduel
            - draftkings
        prop_type:
          type: string
          description: Type of player prop
          example: round_1_score
        line_value:
          type: string
          description: The line value for the prop
          example: "71.5"
        market:
          oneOf:
            - type: object
              description: Over/under market
              properties:
                type:
                  type: string
                  enum: [over_under]
                over_odds:
                  type: integer
                  description: American odds for over
                under_odds:
                  type: integer
                  description: American odds for under
            - type: object
              description: Milestone market (yes/no)
              properties:
                type:
                  type: string
                  enum: [milestone]
                odds:
                  type: integer
                  description: American odds
        updated_at:
          type: string
          format: date-time
          description: When the prop was last updated
    PGAOpeningPlayerProp:
      type: object
      description: PGA player prop betting data
      required:
        - id
        - game_id
        - player_id
        - vendor
        - prop_type
        - line_value
        - market
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          description: Unique player prop ID
        game_id:
          type: integer
          description: PGA tournament ID
        player_id:
          type: integer
          description: PGA player ID
        vendor:
          type: string
          description: Sportsbook vendor name
          enum:
            - fanduel
            - draftkings
        prop_type:
          type: string
          description: Type of player prop
          example: round_1_score
        line_value:
          type: string
          description: The line value for the prop
          example: "71.5"
        market:
          oneOf:
            - type: object
              description: Over/under market
              properties:
                type:
                  type: string
                  enum: [over_under]
                over_odds:
                  type: integer
                  description: American odds for over
                under_odds:
                  type: integer
                  description: American odds for under
            - type: object
              description: Milestone market (yes/no)
              properties:
                type:
                  type: string
                  enum: [milestone]
                odds:
                  type: integer
                  description: American odds
        opened_at:
          type: string
          format: date-time
          description: When the prop was last updated
    PlayerPropMeta:
      type: object
      description: Metadata for player prop responses (no pagination - all results returned in single response)
      properties:
        per_page:
          type: integer
          description: Total number of results returned
  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: integer
      description: The cursor for pagination
    PerPageParam:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        maximum: 100
        default: 25
      description: Number of results per page
    V2CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      description: Cursor returned by the previous page.
    V2PerPageParam:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Number of results per page.
    PlayerIdsParam:
      name: player_ids[]
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: true
      description: Filter by player IDs
  responses:
    UnauthorizedError:
      description: Unauthorized - Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequestError:
      description: Bad Request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimitError:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
security:
  - ApiKeyAuth: []
paths:
  /pga/v1/players:
    get:
      summary: Get PGA Tour players
      description: Retrieve PGA Tour players with optional filters. Free tier.
      tags:
        - PGA Tour
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/PlayerIdsParam"
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by player name
        - name: first_name
          in: query
          required: false
          schema:
            type: string
          description: Filter by first name
        - name: last_name
          in: query
          required: false
          schema:
            type: string
          description: Filter by last name
        - name: country
          in: query
          required: false
          schema:
            type: string
          description: Filter by country
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active status
      responses:
        "200":
          description: List of PGA Tour players
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PGAPlayer"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /pga/v1/tournaments:
