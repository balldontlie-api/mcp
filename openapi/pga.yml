      tags:
        - PGA Tour v1
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PerPageParam"
        - name: tournament_ids
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
          description: Filter by tournament IDs.
        - name: season
          in: query
          required: false
          schema:
            type: integer
          description: Filter by season year.
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter by tournament status.
      responses:
        "200":
          description: List of PGA Tour tournaments in the v1 representation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PGATournament"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /pga/v2/tournaments:
