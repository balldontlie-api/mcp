openapi: 3.1.0
info:
  title: BALLDONTLIE - Valorant API
  version: 1.0.0
  description: Valorant reference data, tournaments, matches, live snapshots, rounds, and player statistics.
servers:
  - url: https://api.balldontlie.io
    description: Production server
security:
  - ApiKeyAuth: []
tags:
  - name: Valorant
    description: Valorant API endpoints
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
