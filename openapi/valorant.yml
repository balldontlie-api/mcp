  /valorant/v1/player_transfers:
    get:
      operationId: getValorantPlayerTransfers
      summary: List player transfers
      description: Returns player and coach transfer history. Requires ALL-STAR tier or higher.
      tags:
        - Valorant
      parameters:
        - name: player_ids[]
          in: query
          required: false
          description: Filter by one or more player IDs.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
        - name: team_ids[]
          in: query
          required: false
          description: Filter by one or more source or destination team IDs.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
        - name: dates[]
          in: query
          required: false
          description: Filter by action dates in YYYY-MM-DD format.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: date
        - name: cursor
          in: query
          required: false
          description: Cursor from the previous response's meta.next_cursor value.
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          description: Maximum number of results to return. Defaults to 25; maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
