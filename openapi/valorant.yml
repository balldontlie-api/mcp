  /valorant/v1/player_match_weapon_stats:
    get:
      operationId: getValorantPlayerMatchWeaponStats
      summary: List player weapon statistics for a match
      description: >-
        Returns finalized player kill totals by weapon for one match. Requires GOAT tier or higher. This endpoint is
        completion-only and can return an empty data array while a match is live.
      tags:
        - Valorant
      parameters:
        - name: match_id
          in: query
          required: true
          description: Match ID.
          schema:
            type: integer
            minimum: 1
        - name: player_ids[]
          in: query
          required: false
          description: Filter by one or more player IDs.
          style: form
          explode: true
          schema:
            type: array
            items:
