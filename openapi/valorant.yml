      type: object
      additionalProperties: false
      required:
        - per_page
      properties:
        prev_cursor:
          type: integer
          minimum: 1
        next_cursor:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
    AbilityUsageFields:
      type: object
      additionalProperties: false
      required:
        - grenade_casts
        - ability1_casts
        - ability2_casts
        - ultimate_casts
