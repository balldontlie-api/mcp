  /valorant/v1/countries:
    get:
      operationId: getValorantCountries
      summary: List countries
      description: Returns countries and their competitive regions. Requires Free tier or higher.
      tags:
        - Valorant
      parameters:
        - name: region_ids[]
          in: query
          required: false
          description: Filter by one or more region IDs.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
        - name: cursor
          in: query
          required: false
          description: Cursor from the previous response's meta.next_cursor value.
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          description: Maximum number of results to return. Defaults to 25; maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Country'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                example:
                  summary: Example response
                  value:
                    data:
                      - id: 1
                        code: CA
                        name: Canada
                        region:
                          id: 1
                          name: North America
                    meta:
                      next_cursor: 1
                      per_page: 1
        '400':
          description: Invalid query parameters
        '401':
          description: Missing API key or insufficient account tier
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
