  /valorant/v1/team_round_stats:
    get:
      operationId: getValorantTeamRoundStats
      summary: List team statistics for a round
      description: >-
        Returns finalized team statistics for one round. Requires GOAT tier or higher. This endpoint is completion-only
        and can return an empty data array while the map is live.
      tags:
        - Valorant
      parameters:
        - name: round_id
          in: query
          required: true
          description: Round ID.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamRoundStat'
