                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WNBABettingOdd"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequestError"
